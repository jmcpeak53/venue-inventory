services:
  web:
    build:
      context: .
    container_name: venue-inventory
    restart: unless-stopped
    ports:
      - "${VENUE_INVENTORY_BIND_ADDRESS:-0.0.0.0}:${VENUE_INVENTORY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

