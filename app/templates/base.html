<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>{% block title %}Venue Inventory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <p class="brand"><a href="{{ url_for('pages.home') }}">Venue Inventory</a></p>
      {% if admin_authenticated %}
        <nav class="header-actions" aria-label="Administrator">
          <a href="{{ url_for('admin.item_list') }}">Catalog</a>
          <a href="{{ url_for('admin.booking_list') }}">Bookings</a>
          <form method="post" action="{{ url_for('admin.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Sign out</button>
          </form>
        </nav>
      {% elif customer_authenticated %}
        <nav class="header-actions" aria-label="Booking party">
          <a href="{{ url_for('customer.portal') }}">Portal</a>
          <form method="post" action="{{ url_for('customer.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Sign out</button>
          </form>
        </nav>
      {% endif %}
    </header>
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
